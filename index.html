<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="電工2種道場" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>電工2種サクサク道場 | 過去問効率マスター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#0c4a6e',
              },
              volt: {
                yellow: '#facc15',
                amber: '#f59e0b',
                electric: '#00f0ff',
              }
            },
            keyframes: {
              pop: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '70%': { transform: 'scale(1.05)' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 15px rgba(14, 165, 233, 0.4)' },
                '50%': { boxShadow: '0 0 25px rgba(14, 165, 233, 0.8)' },
              }
            },
            animation: {
              pop: 'pop 0.25s ease-out',
              pulseGlow: 'pulseGlow 2s infinite',
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen selection:bg-sky-500 selection:text-white overscroll-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
